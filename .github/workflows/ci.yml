name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Runs for pushes to main go one at a time, each whole (build, tests, deploy) before the
# next starts. GitHub keeps one pending run per group and cancels an older pending one when
# a newer queues; as runs are created in push order, the one kept is the newest push, and
# no run can deploy while another is deploying. A pull request's run gets a group of its own
# and is not held up.
concurrency:
  group: ${{ github.event_name == 'push' && 'ci-main' || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  native:
    name: Native Swift build and tests
    runs-on: ubuntu-24.04
    # -noble matches the ubuntu-24.04 host's glibc. setup-swift@v2 does not
    # know Swift 6.4.0, so use the official image instead.
    container: swift:6.4-noble
    env:
      # This repo's own compile cache, https://xcache.devtoo.ls: the compiles
      # below go through it (see Scripts/ci-compile-cache.sh). A fork's pull
      # request gets no secret and builds without it. Scoped to this lane
      # (ci-native-linux, distinct from the worker job's ci-wasm below, even
      # though both run on Linux) so CI's own churn never shares storage with
      # real users' default scope or another lane's.
      LLBUILD_CAS_TOKEN: ${{ secrets.XCACHE_TOKEN }}
      LLBUILD_CAS_REMOTE_URL: https://xcache.devtoo.ls/ci-native-linux
    steps:
      - uses: actions/checkout@v4

      - name: Enable the compile cache
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends curl ca-certificates
          Scripts/ci-compile-cache.sh

      - name: Run tests
        run: swift test ${SWIFT_CACHE_FLAGS:+--build-system native $SWIFT_CACHE_FLAGS}

      - name: Build castool
        run: swift build --product castool ${SWIFT_CACHE_FLAGS:+--build-system native $SWIFT_CACHE_FLAGS}

      - name: Check that C compiles go through the cache
        run: Scripts/check-c-cache.sh ${SWIFT_CACHE_FLAGS:+--build-system native $SWIFT_CACHE_FLAGS}

      - name: Check that Swift results travel through the Worker
        run: '[ -z "${CAS_PLUGIN_PATH:-}" ] || Scripts/check-swift-cache.sh ${SWIFT_CACHE_FLAGS:+--build-system native}'

      # Deliberately not cached: it asserts a first compile misses.
      - name: Compilation caching through CASPlugin
        run: Scripts/test-compilation-cache.sh

      - name: Collect crash reproducers
        if: failure()
        run: Scripts/collect-crash-artifacts.sh "$RUNNER_TEMP/crash-artifacts"

      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-reproducers-${{ github.job }}
          path: ${{ runner.temp }}/crash-artifacts
          if-no-files-found: ignore
          retention-days: 14

  macos:
    name: Native Swift build and tests (macOS)
    runs-on: macos-latest
    env:
      # SwiftPM's default swiftbuild backend compiles JavaScriptKit on macOS
      # even though only wasm needs it, and that fails (its custom-executor
      # code needs a newer SDK). The native backend honors the wasi-only
      # dependency conditions.
      BUILD_FLAGS: --build-system native
      # See the native job.
      LLBUILD_CAS_TOKEN: ${{ secrets.XCACHE_TOKEN }}
      LLBUILD_CAS_REMOTE_URL: https://xcache.devtoo.ls/ci-macos
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$xcode"
          swift --version

      - name: Enable the compile cache
        run: Scripts/ci-compile-cache.sh

      - name: Run tests
        run: swift test $BUILD_FLAGS $SWIFT_CACHE_FLAGS

      - name: Build castool
        run: swift build $BUILD_FLAGS --product castool $SWIFT_CACHE_FLAGS

      - name: Check that C compiles go through the cache
        run: Scripts/check-c-cache.sh $BUILD_FLAGS $SWIFT_CACHE_FLAGS

      - name: Check that Swift results travel through the Worker
        run: '[ -z "${CAS_PLUGIN_PATH:-}" ] || Scripts/check-swift-cache.sh $BUILD_FLAGS'

      # Deliberately not cached: it asserts a first compile misses.
      - name: Compilation caching through CASPlugin
        run: Scripts/test-compilation-cache.sh

      - name: Collect crash reproducers
        if: failure()
        run: Scripts/collect-crash-artifacts.sh "$RUNNER_TEMP/crash-artifacts"

      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-reproducers-${{ github.job }}
          path: ${{ runner.temp }}/crash-artifacts
          if-no-files-found: ignore
          retention-days: 14

  worker:
    name: Build Cloudflare Worker WebAssembly bundle
    runs-on: ubuntu-24.04
    # A pull request's preview is one deployment, `pr-<number>`, and every push
    # deploys it from its own run: without this, runs for older commits finish
    # after newer ones and leave old code live on the preview. Only the newest
    # push's run is worth finishing; pushes to main are never cancelled.
    concurrency:
      group: worker-${{ github.head_ref || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # -noble matches the ubuntu-24.04 host's glibc. setup-swift@v2 does not
    # know Swift 6.4.0, so use the official image instead.
    container: swift:6.4-noble
    env:
      # See the native job. Its own lane, not ci-native-linux: this job
      # targets wasm32, a different target triple on the same OS.
      LLBUILD_CAS_TOKEN: ${{ secrets.XCACHE_TOKEN }}
      LLBUILD_CAS_REMOTE_URL: https://xcache.devtoo.ls/ci-wasm
    steps:
      - uses: actions/checkout@v4

      - name: Install the Swift WebAssembly SDK for this toolchain
        env:
          SWIFT_RELEASE_TAG: swift-6.4.0-RELEASE
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends curl ca-certificates
          tag="$SWIFT_RELEASE_TAG"
          lower="$(echo "$tag" | tr '[:upper:]' '[:lower:]')"
          curl -fsSL -o /tmp/wasm-sdk.artifactbundle.tar.gz \
            "https://download.swift.org/${lower}/wasm-sdk/${tag}/${tag}_wasm.artifactbundle.tar.gz"
          swift sdk install /tmp/wasm-sdk.artifactbundle.tar.gz

      # After the SDK step, which installs curl.
      - name: Enable the compile cache
        run: Scripts/ci-compile-cache.sh

      # Everything after `--` goes to worker-build's nested `swift build`.
      - name: Build Worker bundle
        run: |
          swift package --allow-writing-to-package-directory worker-build --product CASWorkerWasm --configuration release -- ${SWIFT_CACHE_FLAGS:+--build-system native $SWIFT_CACHE_FLAGS}
          test -s build/worker/worker.mjs
          test -s build/worker/WorkerKit.wasm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Distributed CAS end to end (workerd, castool, swiftc plugin)
        run: Scripts/test-remote-cache.sh

      # Previews need the repository's Cloudflare secrets, which a pull request
      # from a fork does not get.
      - name: Deploy a Worker Preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
        run: Scripts/deploy-preview.sh

      # A new connection used to cost about 1.4 s over a route with no Durable
      # Object (issue #6); the two lines show how this change compares with the live cache.
      - name: Time new connections, live cache against the preview
        if: env.PREVIEW_URL != ''
        run: Scripts/time-connections.sh "${CAS_REMOTE_URL:-https://xcache.devtoo.ls}" "$PREVIEW_URL"

      # The bundle that passed the end-to-end test above is the one the deploy job ships.
      - name: Keep the Worker bundle for the production deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: worker-bundle
          path: build/worker
          if-no-files-found: error
          retention-days: 7

      - name: Collect crash reproducers
        if: failure()
        run: Scripts/collect-crash-artifacts.sh "$RUNNER_TEMP/crash-artifacts"

      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-reproducers-${{ github.job }}
          path: ${{ runner.temp }}/crash-artifacts
          if-no-files-found: ignore
          retention-days: 14

  # A merge to main puts the Worker live, once every job above has passed. A pull
  # request never gets here; its change is only on its preview.
  deploy:
    name: Deploy the Worker to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [native, macos, worker]
    runs-on: ubuntu-24.04
    # Ordered by the workflow's own concurrency group above, not one here: a job-level
    # group would queue jobs in the order they become ready, not in push order.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: worker-bundle
          path: build/worker

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Same wrangler as the previews. `wrangler deploy` keeps the secrets already on the
      # Worker (CAS_TOKEN), so none is uploaded here.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -s build/worker/worker.mjs ] && [ -s build/worker/WorkerKit.wasm ] || { echo "::error::the Worker bundle is missing"; exit 1; }
          npx --yes wrangler@4.145.0 deploy --message "${GITHUB_SHA} from ${GITHUB_REPOSITORY}"
