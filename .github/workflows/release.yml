name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build CASPlugin (macOS arm64)
    runs-on: macos-latest
    env:
      # Builds through the previous release's plugin and the live cache; see
      # Scripts/ci-compile-cache.sh.
      LLBUILD_CAS_TOKEN: ${{ secrets.XCACHE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$xcode"
          swift --version

      - name: Enable the compile cache
        run: Scripts/ci-compile-cache.sh

      - name: Build CASPlugin
        # The native backend honors the wasi-only dependency conditions; see ci.yml.
        run: swift build -c release --build-system native --product CASPlugin $SWIFT_CACHE_FLAGS

      - name: Build casd
        run: swift build -c release --build-system native --product casd $SWIFT_CACHE_FLAGS

      - name: Package
        run: |
          bin=$(swift build -c release --build-system native --show-bin-path)
          tar -C "$bin" -czf CASPlugin-macos-arm64.tar.gz libCASPlugin.dylib
          tar -C "$bin" -czf casd-macos-arm64.tar.gz casd

      - uses: actions/upload-artifact@v4
        with:
          name: CASPlugin-macos-arm64
          path: CASPlugin-macos-arm64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: casd-macos-arm64
          path: casd-macos-arm64.tar.gz

  build-linux:
    name: Build CASPlugin (Linux x86_64)
    runs-on: ubuntu-24.04
    # -noble matches the ubuntu-24.04 host's glibc.
    container: swift:6.4-noble
    env:
      # See the macOS job.
      LLBUILD_CAS_TOKEN: ${{ secrets.XCACHE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable the compile cache
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends curl ca-certificates
          Scripts/ci-compile-cache.sh

      # The bin path depends on the build backend, so the build and the path
      # lookup below must agree: native when the cache is on, else the default.
      - name: Build CASPlugin
        run: swift build -c release --product CASPlugin ${SWIFT_CACHE_FLAGS:+--build-system native $SWIFT_CACHE_FLAGS}

      # casd is built with the Swift runtime and Foundation linked in, so it runs on a machine
      # with no Swift toolchain (the plugin is loaded by the compiler, which has one). Static
      # Foundation networking needs libcurl's development files; ci.yml checks this link on
      # every pull request. The result still needs libcurl.so.4 and libc on the host, and, being
      # built here on Ubuntu 24.04, glibc 2.38 or newer (see docs/daemon.md).
      - name: Build casd
        run: |
          apt-get install -y -q --no-install-recommends libcurl4-openssl-dev
          swift build -c release --product casd --static-swift-stdlib ${SWIFT_CACHE_FLAGS:+--build-system native $SWIFT_CACHE_FLAGS}

      - name: Package
        run: |
          bin=$(swift build -c release ${SWIFT_CACHE_FLAGS:+--build-system native} --show-bin-path)
          tar -C "$bin" -czf CASPlugin-linux-x86_64.tar.gz libCASPlugin.so
          tar -C "$bin" -czf casd-linux-x86_64.tar.gz casd

      - uses: actions/upload-artifact@v4
        with:
          name: CASPlugin-linux-x86_64
          path: CASPlugin-linux-x86_64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: casd-linux-x86_64
          path: casd-linux-x86_64.tar.gz

  publish:
    name: Publish GitHub Release
    needs: [build-macos, build-linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: CASPlugin-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: casd-*
          merge-multiple: true

      - name: Checksums
        run: sha256sum CASPlugin-*.tar.gz casd-*.tar.gz > SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber CASPlugin-*.tar.gz casd-*.tar.gz SHA256SUMS
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes CASPlugin-*.tar.gz casd-*.tar.gz SHA256SUMS
          fi
